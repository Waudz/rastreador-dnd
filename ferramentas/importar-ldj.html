<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self'">
<title>Importar tradução do Livro do Jogador</title>
<style>
  :root { color-scheme: dark; --bg:#111018; --panel:#1b1a24; --txt:#e8e4d8; --muted:#9a95a8; --acc:#d4a84b; --bad:#e06c6c; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width:860px; margin:0 auto; padding:20px; }
  .box { background:var(--panel); border-radius:10px; padding:16px; margin:12px 0; }
  button, .btn { background:var(--acc); color:#111; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  button:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--muted); } .bad { color:var(--bad); }
  pre { white-space:pre-wrap; background:#0c0b11; padding:10px; border-radius:6px; max-height:420px; overflow:auto; font-size:13px; }
  label { display:block; margin:8px 0; }
</style>
</head>
<body>
<main>
  <h1>Importar tradução do Livro do Jogador</h1>
  <p class="muted">O arquivo é lido só neste navegador. O resultado fica salvo para o rastreador e vai para o seu repositório privado na próxima sincronização.</p>
  <div class="box">
    <label>Arquivo (PDF, TXT ou um JSON exportado antes): <input type="file" id="arq" accept=".pdf,.txt,.json"></label>
    <label><input type="checkbox" id="norm" checked> Usar o vocabulário do rastreador (salvaguarda, círculo, dano ígneo…)</label>
    <button id="ir" disabled>Importar</button>
    <p id="status" class="muted"></p>
  </div>
  <div class="box" id="res" hidden>
    <p id="resumo"></p>
    <button id="baixar">Baixar JSON (guarde como backup)</button>
    <a class="btn" href="../index.html">Voltar ao rastreador</a>
    <h3>Amostra</h3>
    <pre id="amostra"></pre>
    <details><summary>Avisos</summary><pre id="avisos"></pre></details>
  </div>
</main>
<script type="module" src="importar-ldj.js"></script>
</body>
</html>
