<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://pdjzahpxjrlbqqtzkfdr.supabase.co; worker-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Minha conta — Rastreador D&D</title>
  <meta name="theme-color" content="#111018">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/icones.js" defer></script>
  <script src="js/config-nuvem.js" defer></script>
  <script src="js/nuvem.js" defer></script>
  <script src="js/conta.js" defer></script>
</head>
<body>
  <main class="tracker">
    <header class="header">
      <div>
        <p class="eyebrow">Dungeons &amp; Dragons · 5ª edição</p>
        <h1>Minhas campanhas</h1>
      </div>
    </header>

    <!-- entrar -->
    <section class="panel" id="entrar" hidden>
      <div class="seg" style="margin-bottom:12px">
        <button type="button" class="small on" id="aba-entrar">Entrar</button>
        <button type="button" class="small" id="aba-criar">Criar conta</button>
      </div>
      <form id="form-login" class="cmg" autocomplete="on">
        <div id="campo-nome" style="grid-column:span 2" hidden><label for="l-nome">Seu nome</label><input id="l-nome" name="nome" maxlength="60" autocomplete="nickname"></div>
        <div style="grid-column:span 2"><label for="l-email">E-mail</label><input id="l-email" name="email" type="email" autocomplete="username" required></div>
        <div style="grid-column:span 2"><label for="l-senha">Senha</label><div class="pw"><input id="l-senha" name="senha" type="password" minlength="8" autocomplete="current-password" required><button type="button" class="pw-eye"></button></div></div>
      </form>
      <div class="row" style="margin:10px 0 0">
        <button type="button" class="primary" id="btn-login">Entrar</button>
        <button type="button" class="small subtle" id="btn-link" title="Envia um link de acesso para o seu e-mail">Entrar por link no e-mail</button>
      </div>
      <div class="muted" id="msg-login" style="margin-top:8px"></div>
    </section>

    <!-- logado -->
    <div id="area" hidden>
      <div class="bar"><span class="muted grow" id="quem"></span><button type="button" class="small" id="btn-sair">Sair</button></div>

      <section class="panel">
        <div class="bar"><h2 class="panel-title grow" style="margin:0">Campanhas</h2>
          <button type="button" class="small" id="abre-camp">Nova</button>
          <button type="button" class="small" id="abre-codigo">Entrar com código</button>
        </div>
        <form id="form-camp" class="row" hidden><input id="c-nome" maxlength="80" placeholder="Nome da campanha" style="flex:1 1 220px" required><button type="submit" class="primary small">Criar</button></form>
        <form id="form-entrar" class="row" hidden><input id="e-codigo" maxlength="20" placeholder="Código de convite" autocomplete="off" style="flex:1 1 220px" required><button type="submit" class="primary small">Entrar</button></form>
        <div class="muted" id="msg-camp" style="margin-bottom:8px"></div>
        <div id="campanhas" class="cards"></div>
      </section>

      <section class="panel">
        <div class="bar"><h2 class="panel-title grow" style="margin:0">Personagens</h2>
          <button type="button" class="small" id="abre-pers">Novo</button>
        </div>
        <form id="form-pers" class="row" hidden>
          <select id="p-camp" style="flex:1 1 170px" required></select>
          <input id="p-nome" maxlength="80" placeholder="Nome do personagem" style="flex:1 1 200px" required>
          <button type="submit" class="primary small">Criar</button>
        </form>
        <div class="muted" id="msg-pers" style="margin-bottom:8px"></div>
        <div id="personagens" class="cards"></div>
      </section>

      <details class="panel">
        <summary class="panel-title" style="font-size:14px">Conta</summary>
        <div class="row" style="margin-top:10px"><input id="a-nome" maxlength="60" placeholder="Seu nome" style="flex:1 1 220px"><button type="button" class="small" id="btn-nome">Salvar nome</button></div>
        <div class="row"><div class="pw" style="flex:1 1 220px"><input id="a-senha" type="password" minlength="8" autocomplete="new-password" placeholder="Nova senha"><button type="button" class="pw-eye"></button></div><button type="button" class="small" id="btn-senha">Trocar senha</button></div>
        <div class="muted" id="msg-conta"></div>
      </details>
    </div>

    <p><a class="btnlike muted" href="./">Rastreador de combate</a></p>
  </main>
</body>
</html>
