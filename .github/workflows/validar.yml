name: Validar fichas e banco
on:
  pull_request:
  push:
    branches: [main, validar-imagens-publicas]   # TEMPORÁRIO: validação da função de imagens públicas; remover antes de qualquer merge
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/regras.test.cjs
      - run: node --test tests/*.cjs
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste-ci
          POSTGRES_DB: rastreador_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: teste-ci
      PGDATABASE: rastreador_teste
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/supabase-fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/01-schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/02-acervos-e-transferencia.sql
      - name: Verificar reaplicação da migração
        run: psql -v ON_ERROR_STOP=1 -f supabase/02-acervos-e-transferencia.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/03-administracao-conta.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/03-administracao-conta.sql
      - name: Imagens de campanhas — migração e reaplicação
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111194808_imagens_campanhas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111194808_imagens_campanhas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112090000_enquadramento_campanhas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112090000_enquadramento_campanhas.sql
      - name: Proteção dos campos exclusivos do mestre — aplicar e reaplicar localmente
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112171652_proteger_campos_mestre.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112171652_proteger_campos_mestre.sql
      - name: Permissões de imagens em banco descartável
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/imagens-campanhas-permissoes.test.sql
          psql -v ON_ERROR_STOP=1 -f tests/enquadramento-campanhas.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/supabase.test.sql
      - name: Permissões de campanhas, documentos, Storage, convites e administradores
        run: psql -v ON_ERROR_STOP=1 -f tests/supabase-permissoes.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/admin.test.sql
      - name: Imagens públicas do catálogo — proposta SQL (aplicar, reaplicar, testar, rollback) em banco descartável
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/propostas/catalogo-imagens-publicas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/propostas/catalogo-imagens-publicas.sql
          psql -v ON_ERROR_STOP=1 -f tests/catalogo-imagens-publicas.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/fase5-jogo-permissoes.test.sql
      - name: Concessões e itens — ataques diretos e estados reais dos motores
        run: |
          node tests/fixtures/campos-mestre.cjs > "$RUNNER_TEMP/campos-mestre-fixture.sql"
          psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/campos-mestre-fixture.sql" -f tests/campos-mestre.test.sql
      - run: bash tests/acervo-concorrencia.sh
